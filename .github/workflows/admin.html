<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean Wave Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f6f2;color:#111;margin:0}.wrap{max-width:1200px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.btn{border:0;background:#f2c94c;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}.panel{background:#fff;border:1px solid #ddd;border-radius:20px;padding:20px;margin-top:20px;overflow:auto}input{padding:12px;border:1px solid #ccc;border-radius:10px;min-width:280px}table{width:100%;border-collapse:collapse;margin-top:15px;min-width:900px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#faf7e8}.verified{color:#16733a;font-weight:700}.no{color:#9a5a00}
</style></head><body><div class="wrap"><div class="top"><div><b>OCEAN WAVE ECO RESORT</b><h1>Booking Admin</h1></div><div><input id="key" type="password" placeholder="Admin key"><button class="btn" onclick="load()">Load Bookings</button> <button class="btn" onclick="download()">Export Excel/CSV</button></div></div>
<div class="panel"><div id="status">Enter your admin key to view bookings.</div><div id="table"></div></div></div>
<script>
let key="";
async function load(){key=document.getElementById("key").value;const r=await fetch("/api/admin/bookings?key="+encodeURIComponent(key));const d=await r.json();if(!r.ok){status.textContent=d.error||"Unauthorized";return}status.textContent=d.length+" booking(s)";table.innerHTML=`<table><thead><tr><th>Date</th><th>Name</th><th>Mobile</th><th>Email</th><th>Stay</th><th>Dates</th><th>Guests</th><th>Verified</th><th>Message</th></tr></thead><tbody>${d.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString()}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.email}</td><td>${x.stayType||"-"}</td><td>${x.checkin} → ${x.checkout}</td><td>${x.guests||"-"}</td><td class="${x.phoneVerified?'verified':'no'}">${x.phoneVerified?'✓ Verified':'Not verified'}</td><td>${x.message||"-"}</td></tr>`).join("")}</tbody></table>`}
function download(){if(!key){alert("Enter admin key first.");return}window.location="/api/admin/export.csv?key="+encodeURIComponent(key)}
</script></body></html>
